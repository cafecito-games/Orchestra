version: "3"

dotenv: [".env"]

vars:
  ORCHESTRA_VERSION:
    sh: |
      described="$(git describe --tags --always --dirty 2>/dev/null || true)"
      case "${described}" in
        "") echo "dev" ;;
        v[0-9]*) echo "${described#v}" ;;
        *) echo "dev+${described}" ;;
      esac
  ORCHESTRA_COMMIT:
    sh: git rev-parse HEAD 2>/dev/null || true
  ORCHESTRA_BUILD_DATE:
    sh: date -u +"%Y-%m-%dT%H:%M:%SZ"
  ORCHESTRA_TREE_STATE:
    sh: |
      if [ -z "$(git status --porcelain 2>/dev/null)" ]; then
        echo "clean"
      else
        echo "dirty"
      fi
  LDFLAGS: >-
    -s -w
    -X github.com/cafecito-games/Orchestra/internal/protocol.BuildVersion={{.ORCHESTRA_VERSION}}
    -X github.com/cafecito-games/Orchestra/internal/protocol.BuildCommit={{.ORCHESTRA_COMMIT}}
    -X github.com/cafecito-games/Orchestra/internal/protocol.BuildDate={{.ORCHESTRA_BUILD_DATE}}
    -X github.com/cafecito-games/Orchestra/internal/protocol.BuildTreeState={{.ORCHESTRA_TREE_STATE}}

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  build:
    desc: Build the portable CGo-free orchestra binary for the current platform
    cmds:
      - mkdir -p bin
      - CGO_ENABLED=0 go build -trimpath -ldflags "{{.LDFLAGS}}" -o bin/orchestra ./cmd/orchestra

  build:all:
    desc: Cross-compile CGo-free orchestra release binaries across darwin and linux (amd64/arm64)
    cmds:
      - mkdir -p dist
      - CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "{{.LDFLAGS}}" -o dist/orchestra-darwin-arm64 ./cmd/orchestra
      - CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags "{{.LDFLAGS}}" -o dist/orchestra-darwin-amd64 ./cmd/orchestra
      - CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "{{.LDFLAGS}}" -o dist/orchestra-linux-arm64 ./cmd/orchestra
      - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "{{.LDFLAGS}}" -o dist/orchestra-linux-amd64 ./cmd/orchestra

  install:
    desc: Build orchestra and atomically install it to ORCHESTRA_INSTALL_DIR (default ~/.local/bin)
    platforms: [linux, darwin]
    vars:
      INSTALL_DIR:
        sh: echo "${ORCHESTRA_INSTALL_DIR:-$HOME/.local/bin}"
    cmds:
      - task: build
      - mkdir -p "{{.INSTALL_DIR}}"
      - cp bin/orchestra "{{.INSTALL_DIR}}/.orchestra.new"
      - chmod 0755 "{{.INSTALL_DIR}}/.orchestra.new"
      - mv -f "{{.INSTALL_DIR}}/.orchestra.new" "{{.INSTALL_DIR}}/orchestra"
      - echo "installed Orchestra {{.ORCHESTRA_VERSION}} to {{.INSTALL_DIR}}/orchestra"

  run:master:
    desc: Run orchestra master from source; append flags after --
    cmds:
      - CGO_ENABLED=0 go run ./cmd/orchestra master {{.CLI_ARGS}}

  run:slave:
    desc: Run orchestra slave from source; append flags after --
    cmds:
      - CGO_ENABLED=0 go run ./cmd/orchestra slave {{.CLI_ARGS}}

  fmt:
    desc: Format Go source files
    cmds:
      - gofmt -w .

  fmt:check:
    desc: Verify Go source formatting
    cmds:
      - |
        unformatted="$(gofmt -l .)"
        if [ -n "$unformatted" ]; then
          echo "Unformatted files:"
          echo "$unformatted"
          exit 1
        fi
    silent: true

  vet:
    desc: Run go vet across unit and system-tagged packages
    cmds:
      - go vet ./...
      - go vet -tags system ./...

  fix:check:
    desc: Verify Go source against go fix analyzers
    cmds:
      - go fix -diff ./...
      - go fix -tags system -diff ./...

  mod:check:
    desc: Verify go.mod and go.sum are tidy
    cmds:
      - go mod tidy -diff

  lint:golangci:
    desc: Run golangci-lint across unit and system-tagged packages
    cmds:
      - golangci-lint run ./...
      - golangci-lint run --build-tags=system ./...

  lint:
    desc: Run static checks across the repository
    cmds:
      - task: fmt:check
      - task: mod:check
      - task: vet
      - task: fix:check
      - task: lint:golangci
      - git diff --check

  unit:test:
    desc: Run unit tests across all packages with the race detector
    cmds:
      - go test -race -count=1 ./...

  system:test:
    desc: Run real-process multi-node end-to-end system tests (orchestra master, multiple orchestra slave nodes, orchestra mcp, fake harnesses)
    cmds:
      - go test -tags system -race -count=1 -timeout 10m ./internal/systemtest/...

  test:
    desc: Run unit and multi-process system test suites
    cmds:
      - task: unit:test
      - task: system:test

  ci:
    desc: Run the full local verification pipeline (lint, unit + system tests with -race, and cross-platform builds)
    cmds:
      - task: lint
      - task: unit:test
      - task: system:test
      - task: build
      - task: build:all

  release:snapshot:
    desc: Build cross-platform GoReleaser snapshot archives and Homebrew cask manifest locally
    cmds:
      - goreleaser release --snapshot --clean

  clean:
    desc: Remove build artifacts in bin/ and dist/
    cmds:
      - rm -rf bin dist
